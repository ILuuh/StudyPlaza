<!-- =====================================================
     MODAL DE LOGIN
===================================================== -->
<article class="modal-dialog modal-dialog-centered">

    <div class="modal-content login-modal">

        <!-- =========================
                 CABEÇALHO
            ========================== -->

        <div class="modal-header login-modal-header">

            <img src="./assets/img/Logo.svg" alt="Logo">

            <h2 class="modal-title" id="login-title">
                Bem-vindo ao Study Plaza
            </h2>

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>

        </div>


        <!-- =========================
                 CORPO
            ========================== -->

        <div class="modal-body">

            <form id="login-form" novalidate autocomplete="off" aria-describedby="form-error">

                <!-- E-MAIL -->

                <div class="mb-3">

                    <label for="input-email" class="form-label obrigatorio">
                        E-mail
                    </label>

                    <input type="email" class="form-control" id="input-email" name="email" placeholder="seu@email.com"
                        required aria-required="true">

                    <div id="email-error" class="error-message" role="alert"></div>

                </div>


                <!-- SENHA -->

                <div class="mb-3">

                    <label for="input-password" class="form-label obrigatorio">
                        Senha
                    </label>

                    <input type="password" class="form-control" id="input-password" name="password"
                        placeholder="••••••••" minlength="6" required aria-required="true">

                    <div id="password-error" class="error-message" role="alert"></div>

                </div>


                <!-- ERRO GERAL -->

                <div id="form-error" class="error-message" role="alert" aria-live="assertive"></div>


                <!-- BOTÃO ENTRAR -->

                <button type="submit" class="btn btnEntrar w-100">
                    Entrar
                </button>

            </form>


            <!-- CADASTRO -->

            <p class="cadastro-texto">

                Não tem uma conta?

                <a href="./cadastro.html" class="linkCadastro">
                    Cadastre-se aqui
                </a>

            </p>

        </div>

    </div>

</article>
