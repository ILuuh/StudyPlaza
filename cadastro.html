<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <!-- viewport: garante comportamento responsivo em dispositivos móveis -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- favicon exibido na aba do navegador -->
  <link rel="icon" href="./assets/img/Logo_Fundo_Roxa.png" type="image/png" />
  <title>Cadastro - Study Plaza</title>

  <!-- Font Awesome: ícones usados na navegação e no rodapé -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- estilos globais e específicos da página de cadastro -->
  <script src="./assets/js/carregarCSS.js" defer></script>

</head>

<body data-css="cadastro">

  <header id="navbar"></header>

  <!-- Main com role/aria-labelledby para acessibilidade e navegação por leitores de tela -->
  <main role="main" aria-labelledby="register-title">

    <section id="vLibras"></section>

    <section id="acessibilidade"></section>

    <!-- Área de cadastro -->
    <section class="register-wrapper">

      <article class="register-container">
        <!-- Imagem ilustrativa e título da página -->
        <img src="./assets/img/ElfaEstudando.png" alt="Ilustração de uma elfa estudando">
        <h1 id="register-title">Venha fazer parte do Study Plaza</h1>

        <!-- Formulário de cadastro:
             - novalidate: validação customizada via js/cadastro.js
             - autocomplete="off" para evitar preenchimento automático em demos -->
        <form id="register-form" novalidate autocomplete="off" aria-describedby="form-error">

          <!-- Campo nome:
               - aria-describedby aponta para span que exibirá mensagens de erro
               - required/aria-required melhoram usabilidade e acessibilidade -->
          <label id="obrigatorio" for="name">Nome:</label>
          <input type="text" id="name" name="name" required aria-required="true" aria-describedby="nameError"
            autocomplete="name" />
          <!-- Elemento para mostrar mensagens de erro relacionadas ao campo 'name' -->
          <span id="nameError" class="error-message" role="alert" aria-live="assertive"></span>

          <!-- Campo email com tipo apropriado para validação básica pelo navegador -->
          <label id="obrigatorio" for="email">Email:</label>
          <input type="email" id="email" name="email" required aria-required="true" aria-describedby="emailError"
            autocomplete="email" />
          <span id="emailError" class="error-message" role="alert" aria-live="assertive"></span>

          <!-- Senha:
               - autocomplete="new-password" para evitar preenchimento automático de senhas existentes -->
          <label id="obrigatorio" for="senha">Senha:</label>
          <div class="password-wrapper">
            <input type="password" id="senha" name="senha" required aria-required="true"
              aria-describedby="passwordError" autocomplete="new-password" />
          </div>
          <span id="passwordError" class="error-message" role="alert" aria-live="assertive"></span>

          <!-- Confirmação de senha:
               - implementações típicas verificam igualdade entre senha e confirmação no JS -->
          <label id="obrigatorio" for="confirm-password">Confirmar Senha:</label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" name="confirm-password" required aria-required="true"
              aria-describedby="confirmPassword-error" autocomplete="new-password" />
          </div>
          <span id="confirmPassword-error" class="error-message" role="alert" aria-live="assertive"></span>

          <!-- Tipo de usuário:
               - implementações típicas verificam igualdade entre senha e confirmação no JS -->
          <label id="obrigatorio" for="tipo_usuario">Qual é sua profissão:</label>
          <div class="select-wrapper">
            <select id="profissao">
              <option value="estudante" selected>
                Estudante
              </option>

              <option value="professor">
                Professor
              </option>
            </select>
          </div>
          <span id="profissaoError" class="error-message" role="alert" aria-live="assertive"></span>

          <!-- Botão de envio do formulário -->
          <button type="submit" class="confirm">Cadastrar</button>
          <!-- Mensagens de erro de nível do formulário (ex.: servidor, validação global) -->
          <div id="form-error" class="error-message" role="alert" aria-live="assertive"></div>

        </form>

        <!-- Link de navegação para voltar à página inicial -->
        <div class="links">
          <a href="index.html">Voltar</a>
        </div>

      </article>

    </section>

    <!-- =====================================================
     MODAL DE LOGIN
    ===================================================== -->

    <section class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="login-title" aria-hidden="true">
    </section>

  </main>

  <footer id="footer" class="footer"></footer>

  <!-- Scripts:
       - cadastro.js: validação e envio do formulário de cadastro
       - alterarTemas.js / login.js / acessibilidade.js: controlam UI e comportamentos -->
  <script src="./assets/js/cadastro.js" defer></script>
  <script src="./assets/js/navbar.js"></script>
  <script src="./assets/js/footer.js"></script>
  <script src="./assets/js/login.js"></script>
  <script src="./assets/js/vLibras.js"></script>
  <script src="./assets/js/acessibilidade.js"></script>
  <script src="./assets/js/alterarTemas.js"></script>
  <script>window.gtranslateSettings = { "default_language": "pt", "native_language_names": true, "detect_browser_language": true, "languages": ["pt", "en", "es"], "wrapper_selector": ".gtranslate_wrapper", "switcher_horizontal_position": "inline", "float_switcher_open_direction": "bottom", "alt_flags": { "en": "usa", "pt": "brazil" } }</script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>
  <!-- VLibras: plugin oficial de Libras; instancia o widget de tradução em Libras -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

</body>

</html>
