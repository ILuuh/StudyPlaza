<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="Painel de grupos da StudyPlaza com visão geral, indicadores e acompanhamento de atividades." />
  <meta name="author" content="StudyPlaza" />
  <title>Painel de Grupos - StudyPlaza</title>
  <link rel="icon" href="../assets/img/Logo_Fundo_Roxa.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <script src="../assets/js-logeed/carregarCSS.js"></script>

  <!-- Cabeçalho: inclui metadados e estilos. Manter a ordem dos CSS para que painel.css
       sobrescreva regras gerais definidas em style.css quando necessário. -->
</head>

<body data-css="painel">

  <header id="navbar">
  </header>

  <main>
    <section id="vLibras">
    </section>

    <section id="acessibilidade">
    </section>

    <!-- Conteúdo principal do painel: título, métricas e lista de grupos.
         Elementos usam data-translate para serem atualizados dinamicamente pelo TranslationSystem. 
         
          Outra opção para text painel:  Acompanhe desempenho, atividades e engajamento dos grupos em um só
          lugar. Personalize as ações do seu time e mantenha tudo organizado.
         -->
    <section class="painel-hero" aria-labelledby="painel-hero-titulo">
      <div>
        <h1 id="painel-hero-titulo" data-translate="painel.hero.title">Painel dos seus grupos</h1>
        <p data-translate="painel.hero.text"> Acompanhe seus grupos ativos e configure da forma que quiser.</p>
        <div class="hero-status">
          <div>
            <strong>12</strong>
            <span data-translate="painel.hero.status.groups">Grupos ativos</span>
          </div>
          <!-- <div>
            <strong>84%</strong>
            <span data-translate="painel.hero.status.goal">Meta semanal concluída</span>
          </div>
          <div>
            <strong>216</strong>
            <span data-translate="painel.hero.status.messages">Mensagens novas</span>
          </div> -->
        </div>
      </div>
      <div class="hero-action">
        <a type="button" class="btn-primario" data-translate="painel.hero.actions.create" href="criargrupo.html"> Criar
          novo grupo</a>
        <!-- <button type="button" class="btn-secundario" data-translate="painel.hero.actions.import">Importar lista de
          membros</button> -->
      </div>
    </section>

    <!-- GRUPOS ATIVOS -->
    <div class="painel-grupos" aria-labelledby="grupos-ativos-titulo">
      <div class="cabecalho-secao">
        <h2 id="grupos-ativos-titulo">
          Seus grupos ativos
        </h2>
      </div>

      <div class="tabela-grupos-ativos"></div>
    </div>

    <!-- TODOS OS GRUPOS -->
    <div class="painel-grupos" aria-labelledby="todos-grupos-titulo">
      <div class="cabecalho-secao">
        <h2 id="todos-grupos-titulo">
          Todos os grupos que participo
        </h2>
      </div>

      <div class="tabela-todos-grupos"></div>
    </div>

    <div id="modal-editar-grupo" class="modal-container" style="display: none;">
      <div class="modal-conteudo">
        <h3>Editar Grupo</h3>

        <div class="modal-campo">
          <label for="input-editar-nome-grupo">Nome do Grupo:</label>
          <input type="text" id="input-editar-nome-grupo" placeholder="Digite o novo nome...">
        </div>

        <div class="modal-campo">
          <label for="select-editar-status-grupo">Status do Grupo:</label>
          <select id="select-editar-status-grupo">
            <option value="1">Ativo</option>
            <option value="0">Inativo</option>
          </select>
        </div>

        <div class="modal-acoes">
          <button id="btn-salvar-edicao" class="btn-salvar">Salvar</button>
          <button id="btn-cancelar-edicao" class="btn-cancelar">Cancelar</button>
        </div>
      </div>
    </div>
  </main>

  <div class="gtranslate_wrapper"></div>
  <footer id="footer" class="footer"></footer>

  <script src="../assets/js-logeed/footer.js"></script>
  <script src="../assets/js-logeed/navbar.js"></script>
  <script src="../assets/js/acessibilidade.js"></script>
  <script src="../assets/js/alterarTemas.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <script> window.chtlConfig = { chatbotId: "1666361565" } </script>
  <script async data-id="1666361565" id="chtl-script" type="text/javascript"
    src="https://chatling.ai/js/embed.js"></script>
  <script src="js/geral.js"></script>
  <script src="../js/alterarTemas.js"></script>
  <script src="../js/acessibilidade.js"></script>
  <script>window.gtranslateSettings = { "default_language": "pt", "native_language_names": true, "detect_browser_language": true, "languages": ["pt", "en", "es"], "wrapper_selector": ".gtranslate_wrapper", "switcher_horizontal_position": "inline", "float_switcher_open_direction": "bottom", "alt_flags": { "en": "usa", "pt": "brazil" } }</script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <script src="../assets/js-logeed/painel.js"></script>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    // Inicializa o widget VLibras para tradução de libras.
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
</body>

</html>
