<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Plataforma de aprendizado colaborativo com IA, quizzes e grupos de estudo.">
    <meta name="keywords" content="estudo, educação, grupos de estudo, quizzes, IA, aprendizagem colaborativa">
    <meta name="author" content="Study Plaza">

    <title>Login - Study Plaza</title>

    <link rel="icon" href="./assets/img/Logo_Fundo_Roxa.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script src="./assets/js/carregarCSS.js" defer></script>

</head>

<body data-css="login">
    <header id="navbar"></header>

    <section id="acessibilidade"></section>
    <section id="vLibras"></section>

    <main class="login-page-wrapper">

        <div class="login-container">

            <div class="login-header">

                <a href="./index.html" aria-label="Voltar para a página inicial">
                    <img src="./assets/img/Logo.svg" alt="Logo Study Plaza">
                </a>

                <h1>Bem-vindo ao Study Plaza</h1>

            </div>

            <div class="login-body">

                <form id="login-form" novalidate autocomplete="off">

                    <div class="form-group">

                        <label for="input-email" class="form-label obrigatorio">
                            E-mail
                        </label>

                        <input type="email" id="input-email" name="email" class="form-control"
                            placeholder="seu@email.com" autocomplete="email" required>

                        <div id="email-error" class="error-message" role="alert">
                        </div>

                    </div>

                    <div class="form-group">

                        <label for="input-password" class="form-label obrigatorio">
                            Senha
                        </label>

                        <input type="password" id="input-password" name="password" class="form-control"
                            placeholder="••••••••" autocomplete="current-password" required>

                        <div id="password-error" class="error-message" role="alert">
                        </div>

                    </div>

                    <div id="form-error" class="error-message" role="alert" aria-live="assertive">
                    </div>

                    <button type="submit" class="btnEntrar">
                        Entrar
                    </button>

                </form>

                <p class="cadastro-texto">
                    Não tem uma conta?
                    <a href="./cadastro.html" class="linkCadastro">
                        Cadastre-se aqui
                    </a>
                </p>

            </div>

        </div>

    </main>

    <footer id="footer" class="footer"></footer>

    <script src="./assets/js/navbar.js"></script>
    <script src="./assets/js/footer.js"></script>
    <script src="./assets/js/login.js"></script>
    <script src="./assets/js/vLibras.js"></script>
    <script src="./assets/js/acessibilidade.js"></script>
    <script src="./assets/js/alterarTemas.js"></script>

    <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <script>
        new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>

</body>

</html>
