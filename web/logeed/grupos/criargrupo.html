<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Grupo</title>
    <link rel="icon" href="../../assets/img/Logo_Fundo_Roxa.png" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="../../assets/js-logeed/carregarCSS.js"></script>
    <link rel="stylesheet" href="../../assets/css-logeed/showtoast.css">

    <!--
      Cabeçalho (head):
      - style.css contém regras globais do site.
      - criargrupo.css contém estilos específicos desta página e deve sobrescrever regras globais quando necessário.
      - manter a ordem dos estilos facilita manutenção e evita conflitos.
    -->
</head>

<body data-css="criargrupo">

    <header id="navbar"></header>

    <main>

        <section id="vLibras"></section>

        <section id="acessibilidade"></section>

        <section class="conteudo-criargrupo">

            <section class="wrapper-criar-grupo">

                <h1 class="titulo">Criar novo grupo</h1>

                <form id="form-grupo" method="POST" novalidate>

                    <div class="campo">
                        <label for="nome">Nome do grupo</label>
                        <input type="text" id="nome"
                            placeholder="Digite o nome do grupo" required>
                    </div>

                    <div class="campo">
                        <label for="descricao" >Descrição</label>
                        <textarea id="descricao"
                            placeholder="Descreva o propósito do grupo"></textarea>
                    </div>

                    <button type="submit" class="btn-criar">Criar Grupo</button>
                </form>
            </section>
        </section>
    </main>

    <div class="gtranslate_wrapper"></div>

    <footer id="footer" class="footer"></footer>


    <script src="../../assets/js-logeed/footer.js"></script>
    <script src="../../assets/js-logeed/navbar.js"></script>
    <script src="../../assets/js/acessibilidade.js"></script>
    <script src="../../assets/js/alterarTemas.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <script>window.gtranslateSettings = { "default_language": "pt", "native_language_names": true, "detect_browser_language": true, "languages": ["pt", "en", "es"], "wrapper_selector": ".gtranslate_wrapper", "switcher_horizontal_position": "inline", "float_switcher_open_direction": "bottom", "alt_flags": { "en": "usa", "pt": "brazil" } }</script>
    <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>
    <script>
        // Inicializa o widget VLibras para tradução em Libras.
        // Colocado aqui para garantir que a lib já foi carregada pelo <script> anterior.
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <script type="module" src="../../assets/js-logeed/criargrupo.js"></script>
</body>

</html>
