<!doctype html>
<html lang="pt-BR" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Entre no Study Chat utilizando sua conta Study Plaza.">
  <meta name="keywords" content="Study Plaza, chat, estudo, grupo de estudos">
  <meta name="author" content="Study Plaza">

  <title>Study Plaza - Study Chat</title>

  <link rel="icon" href="../assets/img/Logo_Fundo_Roxa.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="../utils/jsAuth/carregarCSS.js"></script>
</head>

<body data-css="homeChat">

  <section id="navbar"></section>

  <main class="login-container">

    <section id="vLibras"></section>

    <section class="login-card" aria-labelledby="chat-title">

      <!-- LOGO -->
      <div class="logo-area">

        <div class="logo-icon">
          <i class="fa-solid fa-comments" aria-hidden="true"></i>
        </div>

        <h1 id="chat-title">
          Study Chat
        </h1>

        <p>
          Converse, compartilhe ideias e estude
          junto com a comunidade Study Plaza.
        </p>

      </div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="chat-login-form">

        <!-- LOGIN -->
        <div class="input-group">

          <label for="login">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            Login ou e-mail
          </label>

          <input type="text" id="login" name="login" placeholder="Digite seu login ou e-mail..." autocomplete="username"
            required>

        </div>

        <!-- SENHA -->
        <div class="input-group">

          <label for="password">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            Senha
          </label>

          <input type="password" id="password" name="password" placeholder="Digite sua senha..."
            autocomplete="current-password" required>

        </div>

        <!-- GRUPO -->
        <div class="group-info">

          <i class="fa-solid fa-users" aria-hidden="true"></i>

          <div>
            <span>Grupo atual</span>
            <strong>Grupo Geral</strong>
          </div>

        </div>

        <!-- BOTÃO -->
        <button type="submit" class="enter-button">

          Entrar no chat

          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>

        </button>

        <!-- MENSAGEM DE ERRO/SUCESSO -->
        <p id="login-message" role="alert" aria-live="polite"></p>

      </form>

      <!-- VOLTAR -->
      <button type="button" id="back-button" class="back-button">

        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>

        Voltar

      </button>

    </section>

  </main>

  <div class="gtranslate_wrapper"></div>

  <footer class="footer" id="footer"></footer>

  <script>
    window.gtranslateSettings = {
      "default_language": "pt",
      "native_language_names": true,
      "detect_browser_language": true,
      "languages": ["pt", "en", "es"],
      "wrapper_selector": ".gtranslate_wrapper",
      "switcher_horizontal_position": "inline",
      "float_switcher_open_direction": "bottom",
      "alt_flags": {
        "en": "usa",
        "pt": "brazil"
      }
    };
  </script>

  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <script type="module" src="../utils/jsAuth/carregarComponents.js"></script>
  <script type="module" src="../utils/jsAuth/entrarChat.js"></script>
  <script src="../utils/js/alterarTemas.js"></script>

</body>

</html>
