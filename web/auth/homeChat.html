<!doctype html>
<html lang="pt-BR" data-bs-theme="light">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Entre no Study Chat e converse com seu grupo de estudos.">

  <meta name="keywords" content="Study Plaza, chat, estudo, grupo de estudos">

  <meta name="author" content="Study Plaza">

  <title>Study Plaza - Study Chat</title>

  <link rel="icon" href="../assets/img/Logo_Fundo_Roxa.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="../utils/jsAuth/carregarCSS.js" defer></script>
  <script src="../utils/js/alterarTemas.js" defer></script>
</head>


<body data-css="homeChat">
  <section id="navbar"></section>


  <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

  <main class="login-container">
    <section id="vLibras"></section>

    <section class="login-card" aria-labelledby="chat-title">

      <!-- LOGO -->

      <div class="logo-area">

        <div class="logo-icon">

          <i class="fa-solid fa-comments" aria-hidden="true"></i>

        </div>


        <h1 id="chat-title">
          Study Chat
        </h1>


        <p>
          Converse, compartilhe ideias e estude
          junto com seu grupo.
        </p>

      </div>


      <!-- FORMULÁRIO -->

      <form id="chat-login-form">

        <div class="input-group">

          <label for="username">

            <i class="fa-solid fa-user" aria-hidden="true"></i>

            Seu nome

          </label>


          <input type="text" id="username" placeholder="Digite seu nome..." autocomplete="name" maxlength="50" required>

        </div>


        <!-- GRUPO -->

        <div class="group-info">

          <i class="fa-solid fa-users" aria-hidden="true"></i>


          <div>

            <span>
              Grupo atual
            </span>

            <strong>
              Grupo de Estudos
            </strong>

          </div>

        </div>


        <!-- BOTÃO -->

        <button type="submit" class="enter-button">

          Entrar no chat

          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>

        </button>

      </form>


      <!-- VOLTAR -->
      <button type="button" id="back-button" class="back-button">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        Voltar
      </button>

    </section>

  </main>
  <div class="gtranslate_wrapper"></div>
  <footer class="footer" id="footer"> </footer>

  <script>window.gtranslateSettings = { "default_language": "pt", "native_language_names": true, "detect_browser_language": true, "languages": ["pt", "en", "es"], "wrapper_selector": ".gtranslate_wrapper", "switcher_horizontal_position": "inline", "float_switcher_open_direction": "bottom", "alt_flags": { "en": "usa", "pt": "brazil" } }</script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <script type="module" src="../utils/jsAuth/carregarComponents.js"></script>
  <script type="module" src="../utils/jsAuth/entrarChat.js"></script>

</body>

</html>
