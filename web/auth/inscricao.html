<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description"
    content="Página de inscrição para os cursos da Study Plaza. Preencha seus dados para garantir sua vaga." />
  <meta name="keywords" content="inscrição, matrícula, cursos, graduação, faculdade, Study Plaza" />
  <meta name="author" content="Study Plaza" />
  <title>Inscrição em Curso - StudyPlaza</title>
  <link rel="icon" href="../assets/img/Logo_Fundo_Roxa.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha384-..." crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="../utils/jsAuth/carregarCSS.js"></script>

  <link rel="stylesheet" href="../assets/cssAuth/showtoast.css">
  <!--
      Observações sobre head:
      - meta tags definem comportamento responsivo e SEO básico.
      - ordem dos estilos: style.css com regras globais, inscricao.css para sobrescritas específicas.
      - manter integrity/crossorigin quando usar CDN para segurança.
    -->
</head>

<body data-css="inscricao">

  <header id="navbar"></header>


  <main>
    <section id="vLibras"></section>


    <section id="acessibilidade"></section>

    <!--
          Seção principal de inscrição:
          - Formulário simples postando para processar_inscricao.php (backend).
          - Campos usam atributos HTML5 (required, type) para validação básica no cliente.
          - Para validação JS mais rica, pode-se adicionar manipuladores no arquivo JS (ex.: cadastro.js).
        -->
    <section class="inscricao-section" aria-labelledby="inscricao-titulo">
      <div class="form-container">
        <h1 id="inscricao-titulo">Inscrição para o Curso</h1>
        <p class="intro-texto">Preencha o formulário abaixo para garantir sua vaga e iniciar seu processo de
          matrícula.</p>

        <!--
                  Formulário:
                  - action aponta para um script PHP que deve validar/sanitizar os dados no servidor antes de inserir no BD.
                  - usar CSRF token no backend em produção.
                  - nome/id dos campos devem corresponder ao esperado pelo backend (processar_inscricao.php).
                -->
        <form id="form-inscricao" method="POST" novalidate>

          <fieldset>
            <legend>Seleção do Curso</legend>

            <div class="form-group">
              <label for="curso" id="obrigatorio">Curso Escolhido</label>
              <!--
                              Select com opção padrão desabilitada para forçar escolha.
                              Valores enviados devem corresponder aos IDs/identificadores usados no backend.
                            -->
              <select id="curso" name="curso" required>
                <option value="" disabled selected>Selecione um curso</option>
                <option value="agronegocio">Agronegócio</option>
                <option value="ads">Análise e Desenvolvimento de Software</option>
                <option value="ads-ams">Análise e Desenvolvimento de Software - AMS</option>
                <option value="ge-ead">Gestão Empresarial - EAD</option>
                <option value="gpi">Gestão da Produção Industrial</option>
                <option value="si">Sistemas para Internet</option>
              </select>
            </div>
          </fieldset>

          <!-- Botão de envio:
                         - estilizado via CSS (classe btn-submit).
                         - o atributo novalidate no form permite customizar validação em JS caso deseje. -->
          <button type="submit" class="btn-submit">Finalizar Inscrição</button>

        </form>

      </div>
    </section>

  </main>

  <div class="gtranslate_wrapper"></div>
  <footer class="footer" id="footer"></footer>

  <script type="module" src="../utils/jsAuth/carregarComponents.js"></script>
  <script src="../utils/js/alterarTemas.js"></script>

  <script>window.gtranslateSettings = { "default_language": "pt", "native_language_names": true, "detect_browser_language": true, "languages": ["pt", "en", "es"], "wrapper_selector": ".gtranslate_wrapper", "switcher_horizontal_position": "inline", "float_switcher_open_direction": "bottom", "alt_flags": { "en": "usa", "pt": "brazil" } }</script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    // Inicializa o widget VLibras para conversão em Libras; mantido aqui para garantir que a lib já tenha sido carregada.
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  <script type="module" src="../utils/jsAuth/inscrever.js"></script>
</body>

</html>
