<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Converse e compartilhe conhecimentos no Study Chat.">
  <meta name="keywords" content="Study Plaza, chat, estudo, grupos de estudo">
  <meta name="author" content="Study Plaza">

  <title>Study Plaza - Study Chat</title>

  <link rel="icon" href="../assets/img/Logo_Fundo_Roxa.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="../utils/jsAuth/carregarCSS.js" defer></script>
  <script src="../utils/js/alterarTemas.js" defer></script>
</head>

<body data-css="chat">

  <section id="navbar"></section>

  <main>
    <section id="vLibras"></section>

    <section class="chat-layout">

      <!-- SIDEBAR -->
      <aside class="chat-sidebar">

        <div class="sidebar-header">
          <h2>
            <i class="fa-solid fa-comments"></i>
            Study Chat
          </h2>
        </div>

        <div class="sidebar-info">
          <p>Grupo atual</p>
          <h3>Grupo Geral</h3>
        </div>

        <div class="online-users">

          <h4>
            <i class="fa-solid fa-user"></i>
            Sua conta
          </h4>

          <ul>
            <li>
              <i class="fa-solid fa-circle"></i>
              <span id="current-user-name">Carregando...</span>
            </li>
          </ul>

        </div>

      </aside>

      <!-- CHAT PRINCIPAL -->
      <section class="chat-main">

        <header class="chat-header">

          <div>
            <h2># chat-geral</h2>
            <p>Converse com a comunidade Study Plaza.</p>
          </div>

          <div class="chat-status" id="chat-status">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <span id="chat-status-text">Conectando...</span>
          </div>

          <button type="button" id="leave-chat" class="chat-button">
            Sair
          </button>

        </header>

        <!-- MENSAGENS -->
        <ul class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Mensagens do grupo geral">

          <li id="chat-loading" class="chat-placeholder">
            Carregando mensagens...
          </li>

        </ul>

        <!-- ENVIO -->
        <form class="chat-input-area" id="chat-form">

          <div class="input-wrapper">

            <input type="text" id="chat-input" placeholder="Digite sua mensagem..." autocomplete="off" maxlength="500"
              required disabled>

            <button type="submit" id="send-button" aria-label="Enviar mensagem" disabled>

              <i class="fa-solid fa-paper-plane"></i>

            </button>

          </div>

        </form>

      </section>

    </section>
  </main>

  <div class="gtranslate_wrapper"></div>

  <footer class="footer" id="footer"></footer>

  <script>
    window.gtranslateSettings = {
      "default_language": "pt",
      "native_language_names": true,
      "detect_browser_language": true,
      "languages": ["pt", "en", "es"],
      "wrapper_selector": ".gtranslate_wrapper",
      "switcher_horizontal_position": "inline",
      "float_switcher_open_direction": "bottom",
      "alt_flags": {
        "en": "usa",
        "pt": "brazil"
      }
    };
  </script>

  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <!-- Componentes do Study Plaza -->
  <script type="module" src="../utils/jsAuth/carregarComponents.js"></script>

  <!-- Cliente Socket.IO -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <!-- Lógica do chat -->
  <script type="module" src="../utils/jsAuth/chat.js"></script>

</body>

</html>
