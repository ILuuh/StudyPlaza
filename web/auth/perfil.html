<body data-css="perfil">
    <header id="navbar"></header>

    <main>

        <section id="vLibras">
        </section>

        <section id="acessibilidade"></section>


        <section class="perfil-container">

            <div class="perfil-header-card">
                <div class="perfil-avatar">
                    <img width="150" height="150" style="border-radius: 50%;" src="../assets/img/icon-7797704_1280.png">
                </div>
                <div class="perfil-info-basica">
                    <h1>Luiz Gustavo</h1>
                    <p class="perfil-username">@luiz.study</p>
                </div>
            </div>

            <nav class="perfil-nav">
                <a href="#configuracoes" class="perfil-nav-item active">
                    <i class="fa-solid fa-sliders"></i>
                    Configurações
                </a>

                <button type="button" id="btnEditar" class="perfil-nav-item btn-editar">
                    <i class="fa-solid fa-pen"></i>
                    Editar
                </button>
            </nav>

            <section id="configuracoes" class="perfil-section active-section">

                <div class="config-header">
                    <h2>Configurações da Conta</h2>
                </div>

                <!-- Modo visualização -->
                <div id="configView" class="config-view">

                    <div class="form-group">
                        <label>Nome Completo</label>
                        <div id="nome" class="field-value" aria-live="polite"></div>
                    </div>

                    <div class="form-group">
                        <label>E-mail</label>
                        <div id="email" class="field-value" aria-live="polite"></div>
                    </div>

                    <div class="form-group">
                        <label>Tipo de Usuário</label>
                        <div id="tipo_usuario" class="field-value" aria-live="polite"></div>
                    </div>

                </div>


                <!-- Modo edição -->
                <form id="configForm" class="config-form" style="display: none;">

                    <div class="form-group">
                        <label for="inputNome">Nome Completo</label>

                        <input type="text" id="inputNome" name="nome" required autocomplete="name">
                    </div>


                    <div class="form-group">
                        <label for="inputEmail">E-mail</label>

                        <input type="email" id="inputEmail" name="email" required autocomplete="email">
                    </div>


                    <div class="form-group">
                        <label for="inputTipoUsuario">Tipo de Usuário</label>

                        <select id="inputTipoUsuario" name="tipo_usuario" required>
                            <option value="estudante">Estudante</option>
                            <option value="professor">Professor</option>
                        </select>
                    </div>


                    <div class="config-acoes">

                        <button type="submit" id="btnSalvar" class="btn-primario">
                            <i class="fa-solid fa-check"></i>
                            Salvar
                        </button>

                        <button type="button" id="btnCancelar" class="btn-cancelar">
                            <i class="fa-solid fa-xmark"></i>
                            Cancelar
                        </button>

                    </div>

                </form>

            </section>
