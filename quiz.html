<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Interativo - Study Plaza</title>

  <!-- Meta tags: descrição, palavras-chave e autor para SEO e compartilhamento -->
  <meta name="description"
    content="Teste seus conhecimentos com o quiz interativo da Study Plaza. Acesse agora e descubra como aprender pode ser divertido!">
  <meta name="keywords" content="quiz, conhecimento, estudo, interativo, educação, estudantes, aprendizado">
  <meta name="author" content="Study Plaza">

  <!-- Favicon do site -->
  <link rel="icon" href="./assets/img/Logo_Fundo_Roxa.png" type="image/png" />

  <!-- Font Awesome para ícones (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Estilos: global e específicos para quiz -->
  <script src="./assets/js/carregarCSS.js" defer></script>
</head>

<body data-css="quiz" data-script="quiz">
  <header id="navbar"></header>

  <main>

    <section id="acessibilidade"></section>

    <section class="conteudo-quiz">
      <section id="vLibras"></section>

      <!-- Introdução do quiz: texto explicativo usando data-translate para multilíngue -->
      <section class="intro-quiz" aria-labelledby="intro-title">
        <h1 id="intro-title">Descubra como é fácil aprender com a Study Plaza!</h1>
        <p>Esse quiz é apenas uma demonstração do que você terá acesso após fazer login.
          Nossos quizzes são personalizados
          com base nos seus estudos. Cadastre-se para desbloquear todo o potencial da plataforma!</p>
      </section>

      <!-- Área do quiz:
         - aria-live="polite" para anunciar atualizações para leitores de tela sem interromper
         - elementos com IDs (question/options/result/progress-bar) manipulados por js/quiz.js -->
      <section aria-labelledby="quiz-title">
        <h2 id="quiz-title">Teste seu conhecimento</h2>
        <div class="quiz-container" aria-live="polite">
          <div class="question" id="question">Carregando pergunta...</div>
          <div class="options" id="options"></div>
          <div class="result" id="result"></div>
        </div>

        <!-- Barra de progresso visual; atualizada por js/quiz.js -->
        <div class="quiz-progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </section>

      <!-- =====================================================
     MODAL DE LOGIN
    ===================================================== -->

      <section class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="login-title" aria-hidden="true">
      </section>

    </section>

  </main>

  <footer id="footer" class="footer"></footer>

  <!-- VLibras: plugin de Libras e instância do widget -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

  <script src="./assets/js/quiz.js" defer></script>
  <script src="./assets/js/geral.js"></script>
  <script src="./assets/js/footer.js"></script>
  <script src="./assets/js/login.js"></script>
  <script src="./assets/js/navbar.js"></script>
  <script src="./assets/js/vLibras.js"></script>
  <script src="./assets/js/acessibilidade.js"></script>
  <script>window.gtranslateSettings = { "default_language": "pt", "native_language_names": true, "detect_browser_language": true, "languages": ["pt", "en", "es"], "wrapper_selector": ".gtranslate_wrapper", "switcher_horizontal_position": "inline", "float_switcher_open_direction": "bottom", "alt_flags": { "en": "usa", "pt": "brazil" } }</script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
</body>

</html>
